[project]
name = "mediscout"
version = "0.1.0"
description = "Multi-agent AI Deep Researcher for medical domain"
authors = [{ name = "Prasanna Neelavar", email = "prasanna.neelavar@gmail.com" }, { name = "Ashish Saha", email = "" }, { name = "Saravanan", email = "" }] # Placeholder, feel free to change
requires-python = ">=3.10" # Compatible with Python 3.13

dependencies = [
    "streamlit>=1.30.0",
    "langgraph>=0.0.30",
    "langchain-core>=0.1.10",
    "langchain-community>=0.0.10",
    "langchain-openai>=0.0.1", # For OpenAI-compatible APIs (e.g., OpenRouter)
    "langchain-chroma>=0.1.0", # For ChromaDB integration
    "chromadb>=0.4.20",
    "pypdf>=3.17.0", # For PDF parsing
    "unstructured[local-inference]>=0.11.0", # For robust document parsing (TXT, CSV, etc.)
    "pandas>=2.1.0", # For CSV handling
    "python-dotenv>=1.0.0",
    "pydantic>=2.5.0", # For structured outputs and schemas
    "tenacity>=8.2.0", # For retry mechanisms
    "langsmith>=0.0.70", # For observability
    "httpx>=0.26.0", # For external API calls
    "tiktoken>=0.5.0", # For LLM token counting
    # If you plan to use Ollama directly as a client, uncomment the lines below:
    # "ollama>=0.1.0",
    # "langchain-ollama>=0.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-mock>=3.12.0",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"
