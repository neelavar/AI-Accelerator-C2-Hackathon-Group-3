[project]
name = "mediscout"
version = "0.1.0"
description = "Multi-Agent AI Medical Researcher - Intelligent research assistant for medical literature"
authors = [{name = "Team Group 3", email = "team@mediscout.ai"}]
readme = "README.md"
requires-python = ">=3.13"
license = {text = "MIT"}

dependencies = [
    # Core AI/ML
    "chromadb>=0.4.22",
    "sentence-transformers>=2.3.1",
    "langchain>=0.1.0",
    "langchain-community>=0.0.13",
    "langgraph>=0.0.20",
    "langsmith>=0.0.77",
    
    # LLM Providers
    "openai>=1.12.0",  # For OpenRouter API
    
    # Document Processing
    "pypdf>=4.0.0",
    "pdfminer.six>=20221105",
    "python-magic-bin>=0.4.14; sys_platform == 'win32'",
    
    # Data & Validation
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    
    # HTTP & APIs
    "httpx>=0.26.0",
    "biopython>=1.83",  # For PubMed
    
    # Utilities
    "python-dotenv>=1.0.0",
    "loguru>=0.7.2",
    "tenacity>=8.2.3",
    "rich>=13.7.0",  # For beautiful CLI output
    "typer>=0.9.0",  # For CLI interface
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.3",
    "pytest-cov>=4.1.0",
    "pytest-asyncio>=0.23.3",
    "pytest-mock>=3.12.0",
    "black>=23.12.1",
    "ruff>=0.1.9",
    "mypy>=1.8.0",
    "ipython>=8.19.0",
]

[project.scripts]
mediscout = "mediscout.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "-v",
    "--strict-markers",
    "--tb=short",
    "--cov=src",
    "--cov-report=term-missing",
    "--cov-report=html",
]
markers = [
    "unit: Unit tests",
    "integration: Integration tests",
    "slow: Slow tests",
    "api: Tests requiring API calls",
]

[tool.black]
line-length = 100
target-version = ["py313"]
include = '\.pyi?$'

[tool.ruff]
line-length = 100
target-version = "py313"
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
]
ignore = [
    "E501",  # line too long (handled by black)
    "B008",  # do not perform function calls in argument defaults
]

[tool.mypy]
python_version = "3.13"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = [
    "chromadb.*",
    "sentence_transformers.*",
    "Bio.*",
]
ignore_missing_imports = true

